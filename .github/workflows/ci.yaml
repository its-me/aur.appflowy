name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: ghcr.io/its-me/arch-linux:builder

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Lint PKGBUILD
        run: namcap PKGBUILD

      - name: Check .SRCINFO is up to date
        run: |
          chown builder .
          su builder -c "makepkg --printsrcinfo" > /tmp/.SRCINFO.generated
          if ! diff -u .SRCINFO /tmp/.SRCINFO.generated; then
            echo "::error::.SRCINFO is out of date — regenerate it with: makepkg --printsrcinfo > .SRCINFO"
            exit 1
          fi

      - name: Build package
        run: |
          paru -Syu --noconfirm
          chown -R builder .
          su builder -c "paru -B . --noconfirm --skipreview --noprogressbar --removemake --mflags '--nocheck'"

      - name: Create release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          _ver=$(grep '^pkgver=' PKGBUILD | cut -d= -f2)
          _rel=$(grep '^pkgrel=' PKGBUILD | cut -d= -f2)
          gh release create "${_ver}-${_rel}" --title "AppFlowy ${_ver}-${_rel}"
