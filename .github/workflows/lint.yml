name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/its-me/arch-linux-repository:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install namcap
        run: paru -S --noconfirm namcap

      - name: Lint PKGBUILD
        run: namcap PKGBUILD

      - name: Check .SRCINFO is up to date
        run: |
          chown builder .
          su builder -c "makepkg --printsrcinfo" > /tmp/.SRCINFO.generated
          if ! diff -u .SRCINFO /tmp/.SRCINFO.generated; then
            echo "::error::.SRCINFO is out of date — regenerate it with: makepkg --printsrcinfo > .SRCINFO"
            exit 1
          fi
